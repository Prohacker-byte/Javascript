<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bus information system</title>
    <style>
        .all {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 600px;
            height: 600px; 
            border: 1px solid rgba(103, 6, 6, 0.482);
            background-color: rgb(34, 11, 11);
        }

        .bus-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bus-info img {
            width: 180px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
        }

        .bus-info h1 {
            margin: 0;
            text-align: center;
        }

        .bus-text {
            margin-top: 20px;
            text-align: center;
            border: 1px solid yellow;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <div class="all">
        <div class="bus-info">
            <img src="nashik-india-january-26-2024-260nw-2453098187.webp" alt="Bus">
            <h1 style="color: white;">BUS INFORMATION</h1>
        </div>

        <div class="bus-text">
            <p>User Information</p>
        </div>

        <div class="form-info">
            <form class="one-click">
                <label for="name">Username</label>
                <input type="text" placeholder="Enter your name" required><br><br>

                <label for="age">Age</label>
                <input type="number" placeholder="Enter your age" required><br><br>

                <label for="email">Adhar no</label>
                <input type="email" placeholder="Enter your adhar no" required><br><br>

                <label for="city">Select Your City</label>
                <select name="city" id="city" required>
                    <option value="">--Select Your City--</option>
                    <option value="nashik">Nashik</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="pune">Pune</option>
                </select><br><br>

                <label for="date">Select Date</label>
                <input type="date" id="date" name="date" required><br><br>

                <div>
                    <p>Bus Information</p>
                </div>

                <input type="radio" id="bus1" name="bus" value="bus1" required>
                <label for="bus1">AC Bus 2000</label><br>

                <input type="radio" id="bus2" name="bus" value="bus2" required>
                <label for="bus2">Non-AC Bus 1500</label><br>

                <label for="seats">Number of Seats</label>
                <select name="seats" id="seats" required>
                    <option value="">--Select Number of Seats--</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select><br><br>
            </form>
        </div>
    </div>
</body>
</html>
