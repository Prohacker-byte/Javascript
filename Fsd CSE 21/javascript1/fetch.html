<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop
    </title>
    <style>
        table{
            width:80%;
            margin: 20px auto;
            padding:20px;
            font-size: 20px;
            color:black;
            border: 3px solid black;



        }
        TH{
            background-color: grey;
            color:black;
            padding: 10px;
        }
        tr{
            text-align: center;
            border: 2px solid black;

        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>
                    Serial_No.
                </th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
                </tr>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>

    </table>
   <script>
    const ele = document.getElementById("data");
    const url = "https://dummyjson.com/products";

    async function getProducts() {
        try {
            const fetchData = await fetch(url);
            const data = await fetchData.json();

            let row = "";

            data.products.forEach((item, index) => {
                row += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.title}</td>
                        <td>
                            <img src="${item.thumbnail}" width="100" height="100">
                        </td>
                        <td>${item.category}</td>
                        <td>$${item.price}</td>
                    </tr>
                `;
            });

            ele.innerHTML = row;

        } catch (error) {
            console.log(error);
        }
    }

    getProducts();
</script>
          
</body>
</html>
